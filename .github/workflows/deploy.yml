name: Deploy to Azure app service

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: App serviceに公開
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ih12agittest'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PROFILE }}
          package: .